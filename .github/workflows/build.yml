name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      attest:
        description: Generate GitHub build provenance (default branch only)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.package-upload.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure MSVC Release
        run: >-
          cmake -S . -B build/ci -A x64
          -DBUILD_TESTING=ON
          -DHDD_AUDIO_INTEGRATION_TESTS=OFF
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DCMAKE_EXE_LINKER_FLAGS=/Brepro

      - name: Build
        run: cmake --build build/ci --config Release --parallel

      - name: Test synthesized audio
        run: ctest --test-dir build/ci -C Release --output-on-failure --no-tests=error

      - name: Package unsigned executable
        run: |
          $releaseVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($releaseVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'VERSION must contain a release version such as 0.1.0 or 0.1.0-beta.1.'
          }
          ./scripts/package.ps1 -Executable 'build/ci/Release/hdd-noise.exe' -Destination 'out/release' -Version $releaseVersion

      - name: Upload unsigned package and checksums
        id: package-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hdd-noise-windows-x64-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/release/*.zip
            out/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  attest:
    name: Attest package build provenance
    needs: build
    # PR builds never receive signing permissions. Public default-branch pushes
    # attest automatically; private repositories must explicitly opt in.
    if: >-
      ${{
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        (
          (github.event_name == 'push' &&
            (github.event.repository.private == false || vars.ENABLE_ARTIFACT_ATTESTATIONS == 'true')) ||
          (github.event_name == 'workflow_dispatch' && inputs.attest == true)
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Download only this run's immutable build artifact. No source checkout or
      # execution of repository scripts occurs in this privileged job.
      - name: Download the tested package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: out/release
          digest-mismatch: error

      - name: Generate provenance for the ZIP
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/release/*.zip
          create-storage-record: false
